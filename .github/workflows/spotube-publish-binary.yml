name: Spotube Publish Binary
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (x.x.x)
        default: 4.0.0
        required: true
      dry_run:
        description: Dry run
        required: true
        type: boolean
        default: true
      jobs:
        description: Android publishing jobs
        required: true
        type: string
        default: "playstore"

jobs:
  playstore:
    runs-on: ubuntu-latest
    if: contains(inputs.jobs, 'playstore')
    steps:
      - name: Tagname (workflow dispatch)
        run: echo 'TAG_NAME=${{inputs.version}}' >> $GITHUB_ENV

